name: Deploy a cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Armar bundle de despliegue
        run: |
          mkdir deploy
          cp -r src package.json package-lock.json deploy/
          mkdir -p deploy/tmp
          printf 'deploy %s %s\n' "$GITHUB_SHA" "$(date -u +%FT%TZ)" > deploy/tmp/restart.txt

      - name: Instalar lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Subir por FTPS
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp --env-password -u "$FTP_USER" "ftp://$FTP_HOST" <<'SCRIPT'
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate no
          set net:max-retries 3
          set net:timeout 30
          set cmd:fail-exit true
          set mirror:parallel-transfer-count 2
          mirror -R --delete --no-perms ./deploy/src/ /src/
          put ./deploy/package.json -o /package.json
          put ./deploy/package-lock.json -o /package-lock.json
          put ./deploy/tmp/restart.txt -o /tmp/restart.txt
          bye
          SCRIPT

      - name: Aviso si cambiaron dependencias
        run: |
          if git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -qE '^package(-lock)?\.json$'; then
            echo "::warning title=Dependencias cambiaron::Entra a cPanel -> Setup Node.js App -> Run NPM Install -> Restart"
          else
            echo "Dependencias sin cambios: no hace falta tocar cPanel."
          fi
