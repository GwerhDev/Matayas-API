name: Deploy a cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependencias de producción
        run: npm ci --omit=dev

      - name: Armar bundle de despliegue
        run: |
          mkdir deploy
          cp -r src package.json package-lock.json node_modules deploy/
          mkdir -p deploy/tmp
          printf 'deploy %s %s\n' "$GITHUB_SHA" "$(date -u +%FT%TZ)" > deploy/tmp/restart.txt

      - name: Subir por FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          port: 21
          protocol: ftps
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # La cuenta FTP ya está enjaulada en amplificadoresmatayas-api, raíz "./"
          local-dir: ./deploy/
          server-dir: ./
          # Passenger reinicia la app al cambiar tmp/restart.txt (se sube en cada deploy).
          # No tocar el .env que vive en el servidor (las env vars están en el panel de Node).
          exclude: |
            **/.env
