name: Deploy a cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependencias de producción
        run: npm ci --omit=dev

      - name: Armar bundle de despliegue
        run: |
          mkdir deploy
          cp -r src package.json package-lock.json node_modules deploy/
          mkdir -p deploy/tmp
          printf 'deploy %s %s\n' "$GITHUB_SHA" "$(date -u +%FT%TZ)" > deploy/tmp/restart.txt

      - name: Instalar lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Subir por FTPS
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp --env-password -u "$FTP_USER" "ftp://$FTP_HOST" <<'SCRIPT'
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate no
          set net:max-retries 3
          set net:persist-retries 3
          set net:timeout 30
          set cmd:fail-exit true
          set mirror:parallel-transfer-count 2
          mirror -R --delete --no-perms ./deploy/src/ /src/
          mirror -R --delete --no-perms --size-only ./deploy/node_modules/ /node_modules/
          put ./deploy/package.json -o /package.json
          put ./deploy/package-lock.json -o /package-lock.json
          put ./deploy/tmp/restart.txt -o /tmp/restart.txt
          bye
          SCRIPT
